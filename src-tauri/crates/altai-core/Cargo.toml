[package]
name = "altai-core"
version = "0.7.2"
description = "Shared, Tauri-independent primitives for the ALTAI terminal product"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/altaidevorg/altai-app"

[dependencies]
rusqlite = { version = "0.38.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
