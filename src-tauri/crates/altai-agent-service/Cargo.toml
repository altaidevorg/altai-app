[package]
name = "altai-agent-service"
version = "0.7.2"
description = "Host-neutral ALTAI agent events and workspace services"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/altaidevorg/altai-app"

[dependencies]
altai-core = { path = "../altai-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# İsanAgent — embedded as Rust crate (direct API, no sidecar).
# Track upstream `main`; see src-tauri/Cargo.toml for the bump-workflow notes.
isanagent = { git = "https://github.com/altaidevorg/isanagent.git", branch = "main" }
async-trait = "0.1"
hex = "0.4"
log = "0.4"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "io-util", "process"] }
uuid = { version = "1", features = ["v4"] }
# Needed by ServiceChannel / instance builder tool registration.
# (isanagent already pulls these transitively; keep explicit for clarity.)

[dev-dependencies]
tempfile = "3"
