[package]
name = "altai-cli"
version = "0.6.9-rc.3"
description = "ALTAI terminal product and desktop launcher router"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/altaidevorg/altai-app"

[[bin]]
name = "altai-cli"
path = "src/main.rs"

[dependencies]
altai-core = { path = "../altai-core" }
altai-agent-service = { path = "../altai-agent-service" }
altai-protocol = { path = "../altai-protocol" }
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.0"
isanagent = { git = "https://github.com/altaidevorg/isanagent.git", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "sync", "time", "macros", "io-util", "io-std"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
dirs = "5"

[dev-dependencies]
tempfile = "3"
