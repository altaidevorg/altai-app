[package]
name = "altai-control-plane"
version = "0.1.0"
description = "Federated ALTAI control-plane service contracts and host registration"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/altaidevorg/altai-app"

[dependencies]
altai-control-protocol = { path = "../altai-control-protocol" }
axum = "0.8"
clap = { version = "4.6.1", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postgres = { version = "0.19", features = ["with-serde_json-1"] }
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
