[package]
name = "altai-control-protocol"
version = "0.1.0"
description = "Shared domain contracts for the ALTAI control plane (IDs, revision, actor, error, event)"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/altaidevorg/altai-app"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
