name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.6.6). Created if missing."
        required: true
        default: "v0.6.6"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS (Apple Silicon)
            target: aarch64-apple-darwin
            bundles: app
            arch: aarch64
          - os: macos-14
            label: macOS (Intel)
            target: x86_64-apple-darwin
            bundles: app
            arch: x64
          - os: ubuntu-22.04
            label: Linux (x86_64)
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm
            arch: x64
          - os: windows-latest
            label: Windows (x86_64)
            target: x86_64-pc-windows-msvc
            bundles: nsis
            arch: x64

    steps:
      - uses: actions/checkout@v6

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            name="${{ inputs.tag }}"
          else
            name="${GITHUB_REF##refs/tags/}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            rpm

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: unified-release-${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync latest IsanAgent main
        run: cargo update --manifest-path src-tauri/Cargo.toml -p isanagent

      - name: Build CLI and desktop bundle
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Smoke CLI command contract
        shell: bash
        run: |
          binary="src-tauri/target/${{ matrix.target }}/release/altai-cli"
          if [ "${{ runner.os }}" = "Windows" ]; then
            binary="${binary}.exe"
          fi
          "$binary" --version
          "$binary" version --verbose
          "$binary" doctor --json >/dev/null
          "$binary" --help >/dev/null
          "$binary" . --dry-run >/dev/null
          "$binary" . -p "smoke" --dry-run >/dev/null
          "$binary" open . --dry-run >/dev/null

      - name: Package macOS PKG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ./scripts/package-macos-unified.sh \
            --app "src-tauri/target/${{ matrix.target }}/release/bundle/macos/ALTAI.app" \
            --cli "src-tauri/target/${{ matrix.target }}/release/altai-cli" \
            --version "${{ steps.tag.outputs.name }}" \
            --arch "${{ matrix.arch }}" \
            --out-dir dist/release

      - name: Verify macOS PKG payload
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pkg="$(find dist/release -maxdepth 1 -name '*.pkg' -print -quit)"
          expanded="$RUNNER_TEMP/altai-pkg-expanded"
          pkgutil --expand-full "$pkg" "$expanded"
          desktop="$(find "$expanded" -path '*/Payload/Applications/ALTAI.app/Contents/MacOS/altai-desktop' -print -quit)"
          cli="$(find "$expanded" -path '*/Payload/Applications/ALTAI.app/Contents/Resources/bin/altai-cli' -print -quit)"
          link="$(find "$expanded" -path '*/Payload/usr/local/bin/altai-cli' -print -quit)"
          test -x "$desktop"
          test -x "$cli"
          test -L "$link"
          "$cli" version --verbose
          "$cli" open . --dry-run >/dev/null

      - name: Collect Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/release
          cp src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb dist/release/
          cp src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm dist/release/

      - name: Verify Linux package payloads
        if: runner.os == 'Linux'
        shell: bash
        run: |
          deb="$(find dist/release -maxdepth 1 -name '*.deb' -print -quit)"
          rpm="$(find dist/release -maxdepth 1 -name '*.rpm' -print -quit)"
          root="$RUNNER_TEMP/altai-deb-root"
          dpkg-deb -x "$deb" "$root"
          test -x "$root/usr/bin/altai-desktop"
          test -x "$root/usr/bin/altai-cli"
          "$root/usr/bin/altai-cli" version --verbose
          "$root/usr/bin/altai-cli" open . --dry-run >/dev/null
          rpm -qlp "$rpm" | grep -q '/usr/bin/altai-desktop'
          rpm -qlp "$rpm" | grep -q '/usr/bin/altai-cli'

      - name: Collect Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist/release
          cp src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe dist/release/

      - name: Verify Windows installer and PATH lifecycle
        if: runner.os == 'Windows'
        shell: bash
        run: |
          installer="$(find dist/release -maxdepth 1 -name '*-setup.exe' -print -quit)"
          # Exercise the same current-user directory used by a real silent
          # installation. Tauri's NSIS bootstrapper owns this path; overriding
          # it with /D can bypass its install-mode initialization in CI.
          install_dir="$LOCALAPPDATA/ALTAI"
          "$installer" /S
          test -f "$install_dir/altai-desktop.exe"
          test -f "$install_dir/altai-cli.exe"
          "$install_dir/altai-cli.exe" version --verbose
          "$install_dir/altai-cli.exe" open . --dry-run >/dev/null
          powershell -NoProfile -Command \
            '$target=[IO.Path]::GetFullPath($env:LOCALAPPDATA + "\ALTAI").TrimEnd("\"); $parts=[Environment]::GetEnvironmentVariable("Path","User") -split ";"; if (-not ($parts | Where-Object { [StringComparer]::OrdinalIgnoreCase.Equals($_.TrimEnd("\"),$target) })) { exit 1 }'
          "$install_dir/uninstall.exe" /S
          powershell -NoProfile -Command \
            '$target=[IO.Path]::GetFullPath($env:LOCALAPPDATA + "\ALTAI").TrimEnd("\"); $parts=[Environment]::GetEnvironmentVariable("Path","User") -split ";"; if ($parts | Where-Object { [StringComparer]::OrdinalIgnoreCase.Equals($_.TrimEnd("\"),$target) }) { exit 1 }'

      - uses: actions/upload-artifact@v4
        with:
          name: altai-unified-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error

  publish:
    name: Publish unified installers
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            name="${{ inputs.tag }}"
          else
            name="${GITHUB_REF##refs/tags/}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if [[ "$name" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: altai-unified-*
          path: dist/release
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd dist/release
          sha256sum -- * > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ALTAI ${{ steps.tag.outputs.name }}
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          body: |
            ## ALTAI ${{ steps.tag.outputs.name }}

            Each installer includes both ALTAI Desktop and `altai-cli`.

            - **macOS:** install the `.pkg`; it installs `ALTAI.app` and makes `altai-cli` available in new terminal sessions.
            - **Windows:** run the `-setup.exe`; it installs both executables and adds ALTAI to your user PATH. Open a new terminal after installation.
            - **Linux:** install the `.deb` or `.rpm`; both commands are installed under `/usr/bin`.

            The packages are currently unsigned. See [INSTALL.md](https://github.com/altaidevorg/altai-app/blob/main/INSTALL.md) for platform security prompts and verification steps.
          files: dist/release/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
